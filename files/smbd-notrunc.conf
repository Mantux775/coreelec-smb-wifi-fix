# systemd drop-in for smbd: load smb-notrunc.so into Samba.
# It skips the zero-fill that exfat-fuse performs when Windows pre-sizes a file before copying.
# Source: /storage/.config/smb-notrunc.c
# Remove: delete this file, then: systemctl daemon-reload; systemctl restart smbd
[Service]
Environment=LD_PRELOAD=/storage/.config/smb-notrunc.so
